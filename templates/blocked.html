<!DOCTYPE html>
<html>

<head>
    <title>Blocked</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="box">

        <h2>Access Temporarily Blocked</h2>

        <p>Your login was identified as suspicious.</p>

        <p>
            Please try again after
            <strong id="countdown">{{ remaining }}</strong>
            seconds.
        </p>

        <br>

        <!-- Hidden Button -->
        <div id="loginContainer" style="display: none;">

        <a href="/">
            <button id="backBtn" disabled onclick="goLogin()">
            Back to Login
            </button>
        </a>

        </div>

    </div>
       
    <script>
    // Prevent browser back button
    history.pushState(null, null, location.href);

    window.onpopstate = function () {
        history.go(1);
    };

    // Countdown timer
    let seconds = {{ remaining }};

    const button = document.getElementById("backBtn");

    const countdown = setInterval(() => {
        seconds--;

        if (seconds <= 0) {
            clearInterval(countdown);

            // Enable button after timer ends
            button.disabled = false;
            button.innerText = "Back to Login";
        } else {
            button.innerText = `Wait ${seconds}s`;
        }
    }, 1000);

    function goLogin() {
        window.location.href = "/";
    }

    </script>

</body>

</html>
